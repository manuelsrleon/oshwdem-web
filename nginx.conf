server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Vite emits content-hashed filenames, so these can never go stale
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Must never be cached, or clients pin an old bundle after a deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback for react-router: without this, reloading /live 404s
    location / {
        try_files $uri $uri/ /index.html;
    }
}
