name: Build image

# Builds and pushes the image to GHCR. Deploys nothing.
#
# Chained after a push by build-and-deploy.yml; run it directly to get an
# image without shipping it.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_SUPABASE_ACTIVITIES_TABLE=${{ vars.VITE_SUPABASE_ACTIVITIES_TABLE }}
            VITE_PRETALX_EVENT=${{ vars.VITE_PRETALX_EVENT }}
            VITE_EVENT_START_EPOCH=${{ vars.VITE_EVENT_START_EPOCH }}

      - name: Deployable tag
        run: echo "Deploy this tag -> sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_STEP_SUMMARY"
